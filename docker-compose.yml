version: '3.8'

services:
  stripe-app:
    build:
      context: .
      dockerfile: apps/stripe/Dockerfile
    ports:
      - "3001:3001"
    secrets:
      - secret-file
    environment:
      SECRET_FILE: /secret
    
      # Node environment
      NODE_ENV: ${NODE_ENV:-production}
      
      # Saleor API Configuration
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
      
      # Stripe Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      # STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      
      # App Configuration
      SALEOR_APP_ID: ${SALEOR_APP_ID}
      SALEOR_APP_TOKEN: ${SALEOR_APP_TOKEN}
      
      # DynamoDB Configuration (local)
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # SECRET KEY DEBUG
      # SECRET_KEY: oL/T+Xje1el0KipymTJ2iCqvcTaPmy0h
      
      # Observability (Optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    volumes:
      # - "../..:/app"
      - "pnpm-store:/app/.pnpm-store"
    depends_on:
      dynamodb-local:
        condition: service_started
    networks:
      - dokploy-network
    restart: unless-stopped

  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    image: amazon/dynamodb-local:latest
    environment:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - dynamodb-data:/data
    working_dir: /home/dynamodblocal
    user: root # needed to write to volume
    networks:
      - dokploy-network
    restart: unless-stopped
    
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    command: " dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name saleor-app-config --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 || true; dynamodb put-item --endpoint-url http://dynamodb-local:8000 --table-name saleor-app-config --item '{\"PK\":{\"S\":\"RootConfig\"}, \"SK\":{\"S\":\"\"}, \"value\":{\"M\":{}}}'"
    networks:
      - dokploy-network
    
volumes:
  pnpm-store:
  dynamodb-data:            # 關鍵修正 3：加返呢個 volume
    driver: local
secrets:
  secret-file:
    file: /secret
    
networks:
  dokploy-network:
    external: true
